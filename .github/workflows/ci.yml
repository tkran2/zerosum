name: Solver correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the linear-program checker's dependencies
        run: python -m pip install -r requirements.txt
      - name: Build
        run: make -j2
      - name: Game, solver, and exploitation tests
        run: make unit
      - name: Command line and linear-program cross-check
        run: make cli
      - name: Address and undefined-behavior sanitizers
        run: make sanitize
      - name: Benchmark smoke run
        run: ./build/zerosum bench leduc --target 5 --max-nodes 2e8 --trials 1

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-cmake --parallel 2
      - run: ctest --test-dir build-cmake --output-on-failure
